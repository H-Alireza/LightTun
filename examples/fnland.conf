# Your original GRE tunnel as a LightTun config (/etc/lighttun/tunnels/fnland.conf).
# Same as running on the Finland server:
#   lighttun add --name fnland --type gre --local 65.109.140.176 --remote 94.139.181.126 \
#                --addr 10.10.13.2/30 --peer 10.10.13.1 --mtu 1420
# The other side gets the matching command from: lighttun peer fnland
NAME=fnland
TYPE=gre
LOCAL_IP=65.109.140.176
REMOTE_IP=94.139.181.126
ADDR=10.10.13.2/30
PEER=10.10.13.1
MTU=1420
TTL=255
PRIORITY=normal
